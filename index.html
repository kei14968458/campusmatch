<title>キャンパスマッチナビ 見本版</title>

<style>
/* 本番アプリの public/css/app.css をそのまま使う（デジタル庁デザインシステムの色と文字）。明るい表示のみ */
:root { color-scheme: light; }
/* キャンパスマッチナビ — デジタル庁デザインシステム（DADS）の色・文字・余白に合わせたスタイル */
:root {
  --blue-900: #000060;
  --blue-800: #00118F;
  --blue-700: #0017C1;
  --blue-50: #E8F1FE;
  --lightblue: #008BF2;
  --orange: #C74700;
  --orange-50: #FFEEE2;
  --green: #197A4B;
  --green-50: #E6F5EC;
  --red: #CE0000;
  --red-50: #FDEEEE;
  --gray-1000: #1A1A1A;
  --gray-800: #333333;
  --gray-600: #666666;
  --gray-500: #949494;
  --gray-300: #CCCCCC;
  --gray-100: #F2F2F2;
  --white: #FFFFFF;
  --radius: 8px;
  --focus: 0 0 0 2px #fff, 0 0 0 4px #000000;
  --font: 'Noto Sans JP', 'Noto Sans CJK JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.75; letter-spacing: .02em;
  color: var(--gray-1000); background: var(--white);
  display: flex; flex-direction: column; min-height: 100vh;
}
img, svg { max-width: 100%; }
a { color: var(--blue-700); text-underline-offset: 3px; }
a:hover { color: var(--blue-900); text-decoration-thickness: 3px; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 4px; }
h1, h2, h3 { line-height: 1.5; letter-spacing: .02em; margin: 0 0 .5em; }
h1 { font-size: 32px; }
h2 { font-size: 24px; margin-top: 40px; }
h3 { font-size: 20px; margin-top: 24px; }
p { margin: 0 0 1em; }
.skip { position: absolute; left: -9999px; top: 0; background: var(--white); padding: 8px 16px; z-index: 10; }
.skip:focus { left: 16px; }

.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.main { flex: 1; padding-top: 32px; padding-bottom: 64px; }
.narrow { max-width: 640px; }

/* ヘッダー・フッター */
.site-header { border-bottom: 1px solid var(--gray-300); background: var(--white); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--gray-1000); text-decoration: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230017C1%22%2F%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2213%22%20r%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2213%22%20r%3D%224%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%2F%3E%3Cpath%20d%3D%22M5%2026c1-4%203.5-6%206-6s5%202%206%206M15%2026c1-4%203.5-6%206-6s5%202%206%206%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") center/cover; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 15px; }
.nav a { color: var(--gray-800); text-decoration: none; padding: 4px 0; border-bottom: 3px solid transparent; }
.nav a:hover { color: var(--blue-700); }
.nav a[aria-current="page"] { color: var(--blue-700); border-bottom-color: var(--blue-700); font-weight: 700; }
.site-footer { background: var(--gray-100); padding: 24px 0; font-size: 14px; }
.footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
.footer-inner nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.footer-inner p { margin: 0; }

/* 文字の補助 */
.muted { color: var(--gray-600); }
.small { font-size: 14px; }
.lead { font-size: 18px; color: var(--gray-800); }
.num { font-feature-settings: 'tnum'; }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--blue-700); margin-bottom: 4px; }
.inline { display: inline; }

/* ボタン */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 24px; border-radius: var(--radius); border: 1px solid var(--blue-700);
  background: var(--blue-700); color: var(--white); font: inherit; font-weight: 700; font-size: 16px;
  text-decoration: none; cursor: pointer; letter-spacing: .02em;
}
.btn:hover { background: var(--blue-900); border-color: var(--blue-900); color: var(--white); text-decoration: underline; }
.btn:disabled { background: var(--gray-300); border-color: var(--gray-300); color: var(--gray-600); cursor: not-allowed; }
.btn-secondary { background: var(--white); color: var(--blue-700); }
.btn-secondary:hover { background: var(--blue-50); color: var(--blue-900); }
.btn-danger { background: var(--white); color: var(--red); border-color: var(--red); }
.btn-danger:hover { background: var(--red-50); color: var(--red); border-color: var(--red); }
.btn-sm { min-height: 36px; padding: 4px 14px; font-size: 14px; }
.btn-block { width: 100%; }
.link-btn { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 15px; color: var(--gray-800); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--blue-700); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }

/* フォーム */
.field { margin-bottom: 24px; }
.field > label, .field > .label, fieldset > legend { display: block; font-weight: 700; margin-bottom: 6px; }
.req { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--red); }
.hint { display: block; font-size: 14px; color: var(--gray-600); margin-bottom: 6px; font-weight: 400; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; max-width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--gray-600); border-radius: var(--radius);
  font: inherit; color: var(--gray-1000); background: var(--white);
}
textarea { min-height: 112px; resize: vertical; }
input:hover, select:hover, textarea:hover { border-color: var(--gray-1000); }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--gray-1000); }
fieldset { border: 0; margin: 0 0 24px; padding: 0; min-width: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.choice { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.choice input { width: 22px; height: 22px; accent-color: var(--blue-700); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 6px 14px; border: 1px solid var(--gray-600); border-radius: 999px; font-size: 14px; background: var(--white); }
.chip input:checked + span { background: var(--blue-700); border-color: var(--blue-700); color: var(--white); font-weight: 700; }
.chip input:focus-visible + span { box-shadow: var(--focus); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 16px; }
@media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* お知らせ */
.notice { padding: 14px 18px; border-radius: var(--radius); margin-bottom: 24px; border-left: 6px solid; }
.notice-success { background: var(--green-50); border-color: var(--green); }
.notice-error { background: var(--red-50); border-color: var(--red); }
.notice-info { background: var(--blue-50); border-color: var(--blue-700); }
.notice-warn { background: var(--orange-50); border-color: var(--orange); }
.notice p:last-child { margin-bottom: 0; }

/* カード・パネル */
.card { border: 1px solid var(--gray-300); border-radius: 12px; padding: 24px; background: var(--white); }
.card + .card { margin-top: 16px; }
.panel { background: var(--gray-100); border-radius: 12px; padding: 24px; }
.stack > * + * { margin-top: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.cards .card + .card { margin-top: 0; }

/* 数字のタイル */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0 24px; }
.tile { border: 1px solid var(--gray-300); border-radius: 12px; padding: 16px 18px; }
.tile .k { font-size: 14px; color: var(--gray-600); }
.tile .v { font-size: 32px; font-weight: 700; line-height: 1.3; font-feature-settings: 'tnum'; }
.tile .v small { font-size: 15px; font-weight: 400; margin-left: 4px; }
.tile.alert { border-color: var(--orange); background: var(--orange-50); }
a.tile { color: inherit; text-decoration: none; display: block; }
a.tile:hover { border-color: var(--blue-700); }

/* ラベル */
.tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 700; line-height: 1.6; border: 1px solid currentColor; white-space: nowrap; }
.tag-blue { color: var(--blue-700); background: var(--blue-50); border-color: transparent; }
.tag-orange { color: var(--orange); background: var(--orange-50); border-color: transparent; }
.tag-green { color: var(--green); background: var(--green-50); border-color: transparent; }
.tag-gray { color: var(--gray-800); background: var(--gray-100); border-color: transparent; }
.tag-red { color: var(--red); background: var(--red-50); border-color: transparent; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

/* 先輩カード */
.person { display: flex; flex-direction: column; }
.person h3 { margin: 4px 0 0; font-size: 20px; }
.person .meta { font-size: 14px; color: var(--gray-600); }
.person .topics { font-size: 15px; margin: 8px 0 16px; }
.person .foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--blue-50); color: var(--blue-700); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex: none; }
.person-head { display: flex; gap: 12px; align-items: center; }

/* 表 */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--gray-300); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--gray-300); vertical-align: top; }
thead th { background: var(--gray-100); font-weight: 700; font-size: 14px; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.num, th.num { text-align: right; }
.compare th[scope=row] { width: 180px; background: var(--gray-100); font-size: 14px; }

/* 一覧・予約 */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-bottom: 1px solid var(--gray-300); padding: 16px 0; }
.list > li:first-child { border-top: 1px solid var(--gray-300); }
.booking { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: start; }
.booking .when { font-weight: 700; font-size: 18px; }
@media (max-width: 640px) { .booking { grid-template-columns: 1fr; } }
details { margin-top: 8px; }
details > summary { cursor: pointer; color: var(--blue-700); font-size: 15px; }
details[open] > summary { margin-bottom: 12px; }
.slot-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.slot-pick label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--gray-600); border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
.slot-pick input { width: 20px; height: 20px; accent-color: var(--blue-700); }
.slot-pick label:has(input:checked) { border-color: var(--blue-700); background: var(--blue-50); box-shadow: inset 0 0 0 1px var(--blue-700); }

/* 検索の絞り込み */
.filters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: end; margin-bottom: 24px; }
.filters .field { margin: 0; }
.filters label { font-size: 14px; font-weight: 700; display: block; margin-bottom: 4px; }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .filters { grid-template-columns: 1fr; } }

/* トップ */
.hero { background: var(--blue-50); border-radius: 16px; padding: 48px 40px; margin-bottom: 40px; }
.hero h1 { font-size: 36px; }
.hero .lead { max-width: 640px; }
@media (max-width: 640px) { .hero { padding: 32px 20px; } .hero h1 { font-size: 28px; } h1 { font-size: 26px; } }
.steps { counter-reset: step; list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.steps li { counter-increment: step; border: 1px solid var(--gray-300); border-radius: 12px; padding: 20px; }
.steps li::before { content: counter(step); display: inline-flex; width: 32px; height: 32px; border-radius: 50%; background: var(--blue-700); color: #fff; font-weight: 700; align-items: center; justify-content: center; margin-bottom: 8px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .split { grid-template-columns: 1fr; } }

/* データの棒 */
.bar { height: 12px; background: var(--gray-100); border-radius: 6px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--blue-700); }

/* 文書 */
.doc h2 { font-size: 20px; margin-top: 32px; }
.doc ol, .doc ul { padding-left: 1.4em; }
.doc li { margin-bottom: 6px; }
.draft-note { border: 2px dashed var(--orange); border-radius: 8px; padding: 12px 16px; color: var(--orange); font-weight: 700; margin-bottom: 24px; }

/* メール本文 */
pre.mail { white-space: pre-wrap; word-break: break-all; background: var(--gray-100); padding: 12px; border-radius: 8px; font-size: 13px; font-family: inherit; }

/* 印刷 */
.print-sheet { max-width: 680px; margin: 0 auto; }
.print-code { font-size: 44px; font-weight: 700; letter-spacing: .12em; border: 3px solid var(--gray-1000); border-radius: 12px; padding: 16px; text-align: center; margin: 16px 0; font-feature-settings: 'tnum'; }
@media print {
  .site-header, .site-footer, .no-print, .skip { display: none !important; }
  .main { padding: 0; }
  body { font-size: 12pt; }
}

/* 比較シート：スマートフォンでは横にスクロールし、項目名の列は左に固定する */
@media (max-width: 640px) {
  .compare th[scope=row] { width: auto; min-width: 104px; position: sticky; left: 0; z-index: 1; }
  .compare td, .compare thead th:not(:first-child) { min-width: 220px; }
  .compare thead th:first-child { position: sticky; left: 0; z-index: 2; }
}

/* 見本版だけの帯 */
.demo-bar { background: var(--blue-900); color: #fff; font-size: 13px; line-height: 1.6; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.demo-bar p { margin: 0; flex: 1 1 240px; }
.demo-reset { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.7); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.demo-reset:hover { background: rgba(255,255,255,.15); }
</style>
</head>

      });
      var st = STATS[f.pref];
      show('student/search', { title: '先輩をさがす', student: student, prefs: PREFS, f: f, list: list,
        stats: st ? { outside_per_year: st[0], outside_enrolled: st[1], source: SOURCE } : null,
        compare: S.compare.map(String), prefName: PREFNAME[f.pref] });
    },
    '/student/bookings': function () { show('student/bookings', { title: '面談の予約', list: bookingRows(), now: Date.now() }); },
    '/student/compare': function () {
      show('student/compare', { title: '比較シート', list: S.compare.filter(function (id) { return S.ambassadors[id]; }).map(function (id) { return ambRow(S.ambassadors[id]); }) });
    },
    '/guidelines': function () { show('public/guidelines', { title: '安心して使うためのルール' }); },
  };
  function ambassadorPage(id, extra) {
    var a = S.ambassadors[id];
    if (!a) return go('/student/search');
    show('student/ambassador', Object.assign({ title: UNIS[a.uni][0] + ' ' + a.faculty, a: ambRow(a), slots: openSlots(id), inCompare: S.compare.indexOf(Number(id)) > -1, error: null, form: {} }, extra || {}));
  }
  function message(title, text) { show('public/message', { title: title, message: text, link: '/student', linkText: 'マイページへ' }); }

  /* ---------- 操作（POST）：本番の student.js と同じ判定 ---------- */
  function post(action, body) {
    var m;
    if ((m = action.match(/^\/student\/ambassadors\/(\d+)\/book$/))) {
      var id = Number(m[1]); var question = String(body.question || '').trim(); var slotId = String(body.slot_id || '');
      var fail = function (msg) { ambassadorPage(id, { error: msg, form: { question: question, slot_id: slotId } }); window.scrollTo(0, document.getElementById('book').offsetTop - 16); };
      if (!/^\d+$/.test(slotId)) return fail('日時を選んでください。');
      if (question.length > 400) return fail('聞きたいことは400文字以内にしてください。');
      if (L.containsContactInfo(question)) return fail('メールアドレス・電話番号・SNSのIDなど、連絡先にあたる内容は書けません。');
      if (activeCount() >= config.rules.maxActiveBookingsPerStudent) return fail('同時に入れられる予約は' + config.rules.maxActiveBookingsPerStudent + '件までです。面談が終わるか、予約を取り消してから申し込んでください。');
      var slot = openSlots(id).find(function (s) { return String(s.id) === slotId; });
      if (!slot) return fail('この日時は予約できなくなりました。別の日時を選んでください。');
      var dup = S.bookings.some(function (b) { return b.status === 'booked' && slotById(b.slot_id).starts_at === slot.starts_at; });
      if (dup) return fail('同じ時間に、別の面談の予約があります。');
      S.bookings.push({ id: S.nextId++, slot_id: slot.id, ambassador_id: id, question: question, status: 'booked' });
      slot.status = 'booked';
      var a = ambRow(S.ambassadors[id]);
      flash('success', '予約しました：' + L.formatRange(slot.starts_at, slot.duration_min) + '　' + a.university + ' ' + a.display_name + '（見本版のため、メールは送られません）');
      return go('/student/bookings');
    }
    if ((m = action.match(/^\/student\/bookings\/(\d+)\/cancel$/))) {
      var b = S.bookings.find(function (x) { return x.id === Number(m[1]) && x.status === 'booked'; });
      if (!b) { flash('error', '取り消せる予約が見つかりません。'); return go('/student/bookings'); }
      var s = slotById(b.slot_id);
      if (new Date(s.starts_at).getTime() - Date.now() < config.rules.cancelDeadlineHours * 3600e3) { flash('error', '面談の' + config.rules.cancelDeadlineHours + '時間前を過ぎると、取り消せません。'); return go('/student/bookings'); }
      b.status = 'cancelled_by_student'; s.status = 'open';
      flash('success', '予約を取り消しました。');
      return go('/student/bookings');
    }
    if ((m = action.match(/^\/student\/bookings\/(\d+)\/feedback$/))) {
      var rating = Number(body.rating);
      if (!(rating >= 1 && rating <= 5)) { flash('error', '満足度を選んでください。'); return go('/student/bookings'); }
      S.feedback[Number(m[1])] = { rating: rating, comment: String(body.comment || '').slice(0, 400) };
      flash('success', '感想を送りました。ありがとうございました。');
      return go('/student/bookings');
    }
    if ((m = action.match(/^\/student\/bookings\/(\d+)\/report$/))) {
      if (L.REPORT_REASONS.indexOf(body.reason) < 0) { flash('error', '報告の理由を選んでください。'); return go('/student/bookings'); }
      flash('success', '運営事務局に報告しました。内容を確認し、必要に応じて対応します。（見本版のため、実際には送られません）');
      return go('/student/bookings');
    }
    if ((m = action.match(/^\/student\/compare\/(\d+)$/))) {
      var cid = Number(m[1]); var back = String(body.back || '/student/compare');
      if (back.indexOf('/student') !== 0) back = '/student/compare';
      var i = S.compare.indexOf(cid);
      if (i > -1) S.compare.splice(i, 1);
      else if (S.compare.length >= config.rules.maxCompare) flash('error', '比較シートに入れられるのは' + config.rules.maxCompare + '人までです。ほかの先輩を外してから追加してください。');
      else if (S.ambassadors[cid]) S.compare.push(cid);
      return go(back, { keepScroll: true });
    }
    if (action === '/logout') { return message('見本版ではログアウトしません', '本番のアプリでは、ここでログアウトします。'); }
    return message('この操作は見本版にありません', '本番のアプリでは利用できます。');
  }

  /* ---------- 画面の切り替え ---------- */
  function parse(url) {
    var u = new URL(url, 'https://app.invalid');
    var q = {}; u.searchParams.forEach(function (v, k) { q[k] = v; });
    return { path: u.pathname.replace(/\/$/, '') || '/', query: q };
  }
  function go(url, opts) {
    var p = parse(url);
    current = p;
    var y = window.scrollY;
    var m = p.path.match(/^\/student\/ambassadors\/(\d+)$/);
    if (m) ambassadorPage(Number(m[1]));
    else if (routes[p.path]) routes[p.path](p.query);
    else if (p.path === '/' || p.path === '/student/') routes['/student']();
    else if (p.path === '/account') message('アカウント', '本番のアプリでは、ここでパスワードの変更や退会ができます。');
    else if (p.path === '/terms' || p.path === '/privacy') message(p.path === '/terms' ? '利用規約' : 'プライバシーポリシー', '本番のアプリに掲載しています（見本版では省略）。');
    else routes['/student']();
    if (opts && opts.keepScroll) window.scrollTo(0, y);
    else if (p.query && url.indexOf('#') > -1) { var el = document.getElementById(url.split('#')[1]); if (el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-reset]')) { seed(); go('/student'); return; }
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (href === '#') { e.preventDefault(); return; }
    if (href.charAt(0) === '/') { e.preventDefault(); go(href); }
  });
  document.addEventListener('submit', function (e) {
    var form = e.target; e.preventDefault();
    var fd = new FormData(form); var body = {};
    fd.forEach(function (v, k) { if (k !== '_csrf') body[k] = v; });
    var action = form.getAttribute('action') || current.path;
    if ((form.getAttribute('method') || 'get').toLowerCase() === 'get') {
      var qs = new URLSearchParams(body).toString();
      return go(action + (qs ? '?' + qs : ''));
    }
    post(action, body);
  });

  go('/student');
})();

</script>
</body>
</html>
